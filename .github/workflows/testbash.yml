name: testbash

on:
  push:

jobs:
  run-bash-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run hello script checker
        run: python3 tests/run_hello_check.py
